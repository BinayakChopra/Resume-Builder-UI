<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — ResumeFlow AI</title>
  <meta name="description" content="Sign in to your ResumeFlow account or continue as Guest to design, edit, and export ATS resumes.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-grid-pattern flex-center" style="min-height: 100vh; padding: 24px; position: relative;">

  <!-- Ambient Glow Orbs -->
  <div class="orb-glow orb-blue"></div>
  <div class="orb-glow orb-purple"></div>

  <!-- Auth Card Container -->
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 40px 32px; border-radius: var(--radius-xl); box-shadow: 0 25px 60px rgba(0,0,0,0.6); position: relative; z-index: 10;">

    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); margin-bottom: 12px;">
        <div class="brand-icon" style="width: 44px; height: 44px; font-size: 1.2rem;"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <span style="font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em;">ResumeFlow AI</span>
      </a>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Next-Gen Career Intelligence & ATS Resume Studio</p>
    </div>

    <!-- Quick Guest Access Banner -->
    <button type="button" class="btn btn-secondary" id="guestLoginBtn" style="width: 100%; margin-bottom: 24px; border: 1px solid var(--accent-cyan); background: rgba(6, 182, 212, 0.08); color: var(--accent-cyan);">
      <i class="fa-solid fa-bolt"></i> 1-Click Instant Guest Access
    </button>

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.08em;">Or Continue With Email</span>
      <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
    </div>

    <!-- Auth Tabs -->
    <div style="display: flex; background: var(--bg-surface-elevated); border-radius: var(--radius-md); padding: 4px; margin-bottom: 24px;">
      <button type="button" class="btn btn-sm active" id="tabSignIn" style="flex: 1; border-radius: var(--radius-sm); border: none; font-size: 0.85rem;" onclick="switchAuthTab('signin')">Sign In</button>
      <button type="button" class="btn btn-sm btn-ghost" id="tabSignUp" style="flex: 1; border-radius: var(--radius-sm); border: none; font-size: 0.85rem;" onclick="switchAuthTab('signup')">Create Account</button>
    </div>

    <!-- Auth Form -->
    <form id="authForm">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label class="form-label">Full Name</label>
        <div style="position: relative;">
          <input type="text" id="authName" class="form-control" placeholder="e.g. Alex Morgan" style="padding-left: 36px;">
          <i class="fa-regular fa-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="authEmail" class="form-control" placeholder="alex@example.com" required style="padding-left: 36px;">
          <i class="fa-regular fa-envelope" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="authPassword" class="form-control" placeholder="••••••••" required style="padding-left: 36px;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width: 100%; margin-top: 12px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Studio
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px;">
      <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentTab = 'signin';

    function switchAuthTab(tab) {
      currentTab = tab;
      const nameGroup = document.getElementById('nameGroup');
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const submitBtn = document.getElementById('authSubmitBtn');

      if (tab === 'signup') {
        nameGroup.style.display = 'block';
        tabSignIn.className = 'btn btn-sm btn-ghost';
        tabSignUp.className = 'btn btn-sm btn-primary';
        submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Free Account';
      } else {
        nameGroup.style.display = 'none';
        tabSignIn.className = 'btn btn-sm btn-primary';
        tabSignUp.className = 'btn btn-sm btn-ghost';
        submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Studio';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Guest Login Button
      document.getElementById('guestLoginBtn').addEventListener('click', () => {
        StorageService.setUserSession({
          name: 'Guest User',
          email: 'guest@resumeflow.ai',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
          role: 'Professional'
        });
        showToast('Welcome to ResumeFlow AI Studio!', 'success');
        setTimeout(() => {
          window.location.href = 'builder.html';
        }, 600);
      });

      // Form Submit
      document.getElementById('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('authEmail').value.trim();
        const name = document.getElementById('authName')?.value.trim() || 'Alex Morgan';

        StorageService.setUserSession({
          name: name || 'User',
          email: email,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80',
          role: 'Professional'
        });

        showToast(`Authenticated successfully as ${name}`, 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      });
    });
  </script>
</body>
</html>
